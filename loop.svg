<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc" id="loop-root">
<title id="loop-title">One control interval of the repertoire layer</title>
<desc id="loop-desc">Perception and memory feed the selector, the active repertoire turns the decision into a target and desired speed, and the operational model moves the agents, whose new positions are perceived at the next interval.</desc>
<defs>
      <style>#loop-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #loop-root .diagram-container { overflow-x: visible; }</style>
<marker id="loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
