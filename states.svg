<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="states-title states-desc" id="states-root">
<title id="states-title">Repertoire and phase transitions</title>
<desc id="states-desc">State machine of one agent: queueing, the two phases of overtaking, return by completion or abandonment, and handoff to the exit journey.</desc>
<defs>
      <style>#states-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #states-root { font-family: var(--font-sans); color: var(--color-ink); }
      #states-root .diagram-container { width: 100%; overflow-x: auto; }
      #states-root .diagram-container { overflow-x: visible; }</style>
<marker id="states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
